<!doctype html>
<html lang="en"><head><link rel="icon" href="/favicon.png"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Epitome Designs: orders</title>
<style>:root{--brand:#841813;--brand2:#59100c;--bg:#faf6f4;--ink:#1e1412;--card:#fff;--line:#e6dad6;--muted:#6f5f5a}@media(prefers-color-scheme:dark){:root{--brand:#b5342a;--brand2:#7a1d16;--bg:#171110;--ink:#f4ebe8;--card:#241a18;--line:#3b2c29;--muted:#b3a09b}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Raleway',system-ui,sans-serif}
.brand{background:linear-gradient(90deg,var(--brand2),var(--brand));padding:14px 18px}.brand div{max-width:1040px;margin:auto;color:#fff;font-size:1.3rem}.brand img{height:46px;width:auto;display:block}
input,select,button{font:inherit;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700;cursor:pointer;transition:filter .15s}button:hover{filter:brightness(1.12)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:2px}main{max-width:1500px;margin:auto;padding:22px 14px 50px}h1{margin:0 0 14px;font-size:1.8rem;font-weight:800}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}input,select,button{padding:9px 11px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;background:var(--card);min-width:900px}
th{background:var(--brand);color:#fff}th,td{overflow-wrap:anywhere;padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.paid{color:#2e9e5e;font-weight:700}#msg{font-weight:600;margin:0 0 8px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}.nb{display:inline-block;padding:6px 10px;border-radius:8px;background:#25d366;color:#04361a;font-weight:700;text-decoration:none;font-size:.85rem}</style></head><body><header class="brand"><div><img src="/logo-white.png" alt="Epitome Designs" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'Epitome Designs'}))"></div></header><main>
<h1>Orders</h1>
<div class="bar">
<input id="key" type="password" placeholder="Access key" aria-label="Access key">
<button id="load">Load orders</button>
<select id="filter" aria-label="Filter by status"><option value="">All statuses</option></select>
</div>
<p id="msg" aria-live="polite"></p>
<div class="wrap"><table><thead><tr><th>#</th><th>Customer</th><th>Order</th><th>Total (KES)</th><th>Expect now (KES)</th><th>Status</th><th>M-Pesa receipt / note</th><th>Date</th><th>Notify</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
const $=id=>document.getElementById(id);let data=[],statuses=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wa=p=>{const d=String(p||'').replace(/\D/g,'').replace(/^0/,'254');return d?`https://wa.me/${d}`:''};
const auth=()=>({Authorization:'Bearer '+$('key').value});
async function load(){
 const r=await fetch('/api/admin',{headers:auth()});const d=await r.json();
 if(!r.ok){$('msg').textContent=d.error;return}
 data=d.orders;statuses=d.statuses;
 $('filter').innerHTML='<option value="">All statuses</option>'+statuses.map(s=>`<option>${s}</option>`).join('');
 $('msg').textContent=data.length+' orders loaded.';draw()}
const full=o=>o.finish==='domain'||o.finish==='site';
const expect=o=>full(o)?o.total:Math.ceil(o.total/2);
const first=o=>String(o.name||'').replace(/\s*\(.*\)\s*$/,'').split(' ')[0]||'there';
const item=o=>o.product.startsWith('domain:')?'domain '+o.product.slice(7):o.product.startsWith('site:')?'website':o.qty+' x '+o.product;
function msgFor(o){const h=`Hello ${first(o)}, `,i=`order #${o.id} (${item(o)})`,site=o.product.startsWith('site:')?` Your site is live at ${location.origin}/s/${o.product.slice(5)}`:'';
 const m={quoted:`${h}your ${i} is waiting for payment. Reply here if you need help paying.`,
 payment_submitted:`${h}we have received your payment details for ${i}. We are confirming and will update you shortly.`,
 deposit_paid:`${h}your payment for ${i} is confirmed. Thank you! We are getting started.${site}`,
 payment_failed:`${h}we could not confirm the payment for ${i}. Please check the M-Pesa code and reply here.`,
 in_production:`${h}${i} is now in production. We will let you know when it is ready.`,
 ready:`${h}good news! ${i} is ready. Please tell us whether you will collect or want delivery.`,
 delivered:`${h}thank you for choosing Epitome Designs! ${i} is complete. We would love your feedback.`};
 return m[o.status]||''}
const notify=o=>{const u=wa(o.phone);return u?`<a class="nb" href="${esc(u)}?text=${encodeURIComponent(msgFor(o))}" target="_blank" rel="noopener">Chat</a>`:'-'};
function draw(){const f=$('filter').value;
 $('rows').innerHTML=data.filter(o=>!f||o.status===f).map(o=>`<tr>
 <td>${o.id}</td>
 <td>${esc(o.name)}<br>${wa(o.phone)?`<a href="${esc(wa(o.phone))}" target="_blank" rel="noopener">${esc(o.phone)}</a>`:'-'}</td>
 <td>${esc(o.product)} x ${o.qty}<br>${esc(o.finish)}${o.design?', design help':''}</td>
 <td>${o.total.toLocaleString('en-KE')}</td>
 <td>${expect(o).toLocaleString('en-KE')}</td>
 <td><select data-id="${o.id}" aria-label="Status for order ${o.id}">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td>
 <td class="${['deposit_paid','in_production','ready','delivered'].includes(o.status)?'paid':''}">${esc(o.receipt)||'-'}</td><td>${esc(o.created)}</td><td>${notify(o)}</td></tr>`).join('')}
$('rows').onchange=async e=>{const id=e.target.dataset.id;if(!id)return;
 const r=await fetch('/api/admin',{method:'POST',headers:auth(),body:JSON.stringify({id:+id,status:e.target.value})});
 $('msg').textContent=r.ok?'Order '+id+' saved as '+e.target.value+'.':'Update failed.';if(r.ok){data.find(o=>o.id==id).status=e.target.value;draw()}};
$('load').onclick=load;$('filter').onchange=draw;
</script></main></body></html>
