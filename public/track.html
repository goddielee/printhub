<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="/favicon.png">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Track your order | Epitome Designs</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#841813;--brand2:#59100c;--bg:#faf6f4;--ink:#1e1412;--card:#fff;--line:#e6dad6;--muted:#6f5f5a}
@media(prefers-color-scheme:dark){:root{--brand:#b5342a;--brand2:#7a1d16;--bg:#171110;--ink:#f4ebe8;--card:#241a18;--line:#3b2c29;--muted:#b3a09b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Raleway',system-ui,sans-serif}
.brand{background:linear-gradient(90deg,var(--brand2),var(--brand));padding:12px 18px}.brand a{display:block;max-width:640px;margin:auto}.brand img{height:46px;display:block}
main{max-width:640px;margin:auto;padding:28px 18px 60px}h1{margin:0 0 4px;font-size:2rem;font-weight:800}.sub{color:var(--muted);margin:0 0 18px}
.box{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:10px;padding:22px;margin-bottom:18px;box-shadow:0 6px 20px rgba(30,20,18,.06)}
label{display:block;font-weight:600;margin:14px 0 5px;font-size:.92rem}
input,button{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700;cursor:pointer;margin-top:16px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:2px}
h2{margin:0;font-size:1.25rem}.st{font-size:1.2rem;font-weight:700;color:var(--brand);margin:8px 0 16px}
ol{list-style:none;padding:0;margin:0 0 16px}li{display:flex;align-items:center;gap:12px;padding:7px 0;color:var(--muted)}
li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:.75rem;color:#fff}
li.done{color:var(--ink)}li.done i{background:var(--brand);border-color:var(--brand)}li.now{color:var(--ink);font-weight:700}li.now i{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 25%,transparent)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}.msg{font-weight:600;color:var(--brand)}
a.lnk{display:inline-block;margin-top:12px;color:var(--brand);font-weight:700}
</style></head><body>
<header class="brand"><a href="/"><img src="/logo-white.png" alt="Epitome Designs"></a></header>
<main><h1>Track your order</h1><p class="sub">Enter your order number and the phone number you used when ordering.</p>
<div class="box"><form id="f"><label for="id">Order number</label><input id="id" inputmode="numeric" required>
<label for="ph">Phone number</label><input id="ph" inputmode="tel" placeholder="0712345678" required><button>Track my order</button></form></div>
<div id="out" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kes=n=>'KES '+Number(n).toLocaleString('en-KE');
$('f').onsubmit=async e=>{e.preventDefault();
 const r=await fetch('/api/track?id='+encodeURIComponent($('id').value.replace(/\D/g,''))+'&phone='+encodeURIComponent($('ph').value));const d=await r.json();
 if(!r.ok){$('out').innerHTML=`<div class="box"><p class="msg">${esc(d.error)}</p></div>`;return}
 const fin=d.step===d.steps.length-1;
 $('out').innerHTML=`<div class="box"><h2>Order #${d.id}: ${esc(d.item)}</h2><p class="st">${esc(d.label)}</p>
 <ol>${d.steps.map((s,i)=>`<li class="${i<d.step||(i===d.step&&fin)?'done':i===d.step?'now':''}"><i aria-hidden="true">${i<d.step||(i===d.step&&fin)?'&#10003;':''}</i>${esc(s)}</li>`).join('')}</ol>
 <div class="row"><span>Order total</span><b>${kes(d.total)}</b></div>${d.due?`<div class="row"><span>${esc(d.dueLabel)}</span><b>${kes(d.due)}</b></div>`:''}
 ${d.link?`<a class="lnk" href="${esc(d.link)}">View your live website</a>`:''}</div>`};
</script></main></body></html>
